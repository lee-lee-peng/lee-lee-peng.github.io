site_name: Lee的小破网站
site_description: 编程笔记整理
site_url: https://www.leiex.com

theme:
  name: material
  palette:
    # 浅色模式
    - scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式

    # 深色模式
    - scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  language: zh
  features:
    - navigation.indexes
    - navigation.tabs
    - navigation.tabs.sticky
    
plugins:
  - search
  - blog:
      blog_dir: blog
      post_dir: "{blog}/posts"
      authors: true
      author_files: "{blog}/.authors.yml"
      authors_profiles: true
      authors_profiles_name: 关于我
      categories: true
      pagination: true
      pagination_per_page: 10

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  
nav:
  - 首页: index.md
  - 博客: 
    - blog/index.md